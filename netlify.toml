# A projekt tisztán statikus: egyetlen index.html, szerverkód nélkül.
# Nincs függvény, nincs API-végpont, nincs build-lépés.
[build]
  publish = "."

# ── BIZTONSÁGI FEJLÉCEK ─────────────────────────────────────────────────
#
# FIGYELEM: ezek CSAK a Netlifyről kiszolgált oldalra vonatkoznak. Ha az
# index.html-t közvetlenül, `file://` protokollal nyitod meg, a böngésző nem
# kap HTTP-fejlécet, tehát a CSP sem érvényesül.
[[headers]]
  for = "/*"
  [headers.values]
    # A CSP a betölthető erőforrások fehérlistája.
    #  · script-src : csak a négy, SRI-vel védett könyvtár tölthető be
    #  · connect-src: ez akadályozza meg, hogy egy esetleg injektált kód
    #                 adatot küldjön ki egy támadó címére
    #  · 'wasm-unsafe-eval' a Tesseract OCR WASM-motorjához kell
    #  · blob: a pdf.js és a Tesseract worker-szálaihoz kell
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://tessdata.projectnaptha.com; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    # Az oldal nem ágyazható be iframe-be (clickjacking ellen).
    X-Frame-Options = "DENY"
    # A böngésző ne találgassa a tartalomtípust.
    X-Content-Type-Options = "nosniff"
    # Az útvonalak/fájlnevek ne szivárogjanak ki a Referer fejlécben.
    Referrer-Policy = "no-referrer"
    # Nem használt, érzékeny böngésző-API-k kikapcsolása.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
